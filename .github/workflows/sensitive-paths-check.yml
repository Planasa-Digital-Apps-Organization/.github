name: Sensitive paths check (reusable)

# Reusable workflow invoked from each Planasa repo's own
# sensitive-paths-check.yml caller. On a PR that touches paths that
# shape AI assistant behavior or PR safeguards:
#   (a) applies the `area:ai-behavior` label (survives merge, queryable
#       later via `is:pr label:area:ai-behavior`)
#   (b) adds / refreshes a single bot comment with the author checklist
#
# Informative only — the actual merge gate is CODEOWNERS plus branch
# protection / rulesets configured per-repo.
#
# The `paths:` filter that decides *when* this workflow runs lives in
# the caller (because reusable workflows can't dynamically configure
# their own trigger). Keep the caller's path list in sync with the
# checklist below.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['area:ai-behavior']
            });

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- sensitive-paths-bot -->';
            const body = `${marker}\n⚠️ **Este PR toca paths sensibles.**\n\n` +
                         `Los paths bajo \`.claude/**\`, \`CLAUDE.md\`, \`AGENTS.md\`, \`.github/**\` ` +
                         `o \`.gitignore\` condicionan el comportamiento del asistente de IA y los ` +
                         `safeguards de PR de todo el proyecto. CODEOWNERS exige revisión de un maintainer.\n\n` +
                         `Checklist para el autor:\n` +
                         `- [ ] El body del PR tiene una sección \`## Notes\` explicando el cambio\n` +
                         `- [ ] No se relaja en silencio el denylist de \`.claude/settings.json\`\n` +
                         `- [ ] No hay entradas \`allow\` más amplias de lo necesario (evita \`Bash(*)\`)\n` +
                         `- [ ] Si cambia una regla con scope de path, sus globs \`paths:\` son correctos\n` +
                         `- [ ] Si se añade un skill, agent o hook nuevo, sigue la estructura existente`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
